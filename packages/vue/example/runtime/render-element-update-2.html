<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .active {
        color: blue;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="../../dist/vue.js"></script>
    <script>
      // 这个只是相同元素的element更新
      const { h, render } = Vue
      console.log(render)
      const vnode = h('div', { class: 'active' }, 'hello render')
      console.log(vnode)
      render(vnode, document.querySelector('#app'))
      setTimeout(() => {
        render(h('h1', 'update'), document.querySelector('#app'))
      }, 2000)
    </script>
  </body>
</html>
